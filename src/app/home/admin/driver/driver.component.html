<div class="driver-container">
    <!-- Header -->
    <div class="page-header">
        <div class="page-title">
            <!-- <div class="page-icon">🚗</div> -->
            <h1>Danh mục tài xế</h1>
        </div>
        <button class="btn-add" (click)="openAddModal()">
            <!-- <span>➕</span> -->
            Thêm mới <mat-icon>add</mat-icon>
        </button>
    </div>

    <!-- Simple Filter -->
    <div class="simple-filter">
        <div class="search-box">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Tìm kiếm theo tên, số điện thoại, bằng lái..."
                (input)="searchDriver($event)"
            />
        </div>
        <select class="sort-select" id="sortSelect" (change)="sortData($event)">
            <option value="id-new">Ngày tạo (mới nhất)</option>
            <option value="id-old">Ngày tạo (cũ nhất)</option>
            <option value="name-az">Tên (A-Z)</option>
            `
            <option value="name-za">Tên (Z-A)</option>
        </select>
        <select class="sort-select" id="entriesSelect" (change)="showEntries($event)">
            <option value="25">Số lượng hiển thị 25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
        </select>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên tài xế</th>
                    <th>Trạng thái hoạt động</th>
                    <th>Mã bằng lái</th>
                    <th>IsActive</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="driverTableBody">
                <tr *ngFor="let driver of listDriver">
                    <td>{{ driver.driverID }}</td>
                    <td>{{ driver.driverName }}</td>
                    <td *ngIf="driver.status == '0'; else other_content">
                        <span class="status-badge"> 🟢 Available </span>
                    </td>
                    <ng-template #other_content>
                        <td>
                            <span class="status-badge"> 🔴 Busy </span>
                        </td>
                    </ng-template>
                    <td>{{ driver.licenseNo }}</td>

                    <td>
                        <span class="status-badge" [class.active]="driver.status" [class.inactive]="!driver.status">
                            {{ driver.isActive }}
                        </span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-action btn-edit" (click)="openDetailModal(driver.driverID)">
                                Chi tiết
                            </button>
                            <button class="btn-action btn-delete" (click)="DeleteDriver(driver.driverID)">Xóa</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Add -->
<div class="modal-overlay" [class.show]="isAddModalOpen" (click)="onOverlayClick($event, 'add')">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">{{ modalTitle }}</h2>
            <button class="modal-close" (click)="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="driverForm" (ngSubmit)="saveDriver()">
                <!-- Username -->
                <div class="form-group">
                    <label class="form-label"> Tên đăng nhập <span class="required">*</span> </label>
                    <input
                        type="text"
                        class="form-input"
                        id="userName"
                        [(ngModel)]="driverForm.userName"
                        name="userName"
                        required
                    />
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label"> Mật khẩu <span class="required">*</span> </label>
                    <input
                        type="password"
                        class="form-input"
                        id="password"
                        [(ngModel)]="driverForm.password"
                        name="password"
                        required
                    />
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label"> Họ và tên đầy đủ <span class="required">*</span> </label>
                    <input
                        type="text"
                        class="form-input"
                        id="fullName"
                        [(ngModel)]="driverForm.fullName"
                        name="fullName"
                        required
                    />
                </div>

                <!-- Driver Name -->
                <div class="form-group">
                    <label class="form-label"> Tên tài xế <span class="required">*</span> </label>
                    <input
                        type="text"
                        class="form-input"
                        id="driverName"
                        [(ngModel)]="driverForm.driverName"
                        name="driverName"
                        required
                    />
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label class="form-label"> Địa chỉ <span class="required">*</span> </label>
                    <textarea
                        class="form-input form-textarea"
                        id="address"
                        [(ngModel)]="driverForm.address"
                        name="address"
                        required
                    ></textarea>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label class="form-label"> Số điện thoại <span class="required">*</span> </label>
                    <input
                        type="tel"
                        class="form-input"
                        id="phone"
                        [(ngModel)]="driverForm.phone"
                        name="phone"
                        required
                    />
                </div>

                <!-- License No -->
                <div class="form-group">
                    <label class="form-label"> Số bằng lái <span class="required">*</span> </label>
                    <input
                        type="text"
                        class="form-input"
                        id="licenseNo"
                        [(ngModel)]="driverForm.licenseNo"
                        name="licenseNo"
                        required
                    />
                </div>

                <!-- Expire Date -->
                <div class="form-group">
                    <label class="form-label"> Ngày hết hạn bằng lái <span class="required">*</span> </label>
                    <input
                        type="date"
                        class="form-input"
                        id="expireDate"
                        [(ngModel)]="driverForm.expireDate"
                        name="expireDate"
                        required
                    />
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" (click)="closeAddModal()">Hủy</button>
                    <button type="submit" class="btn-save">{{ isEditMode ? 'Cập nhật' : 'Lưu' }}</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Chi tiết -->
<div class="modal-overlay" [class.show]="isDetailModalOpen" (click)="onOverlayClick($event, 'detail')">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Chi tiết tài xế</h2>
            <button class="modal-close" (click)="closeDetailModal()">&times;</button>
        </div>
        <div class="modal-body" *ngIf="currentDriver; else loadingTemplate">
            <form id="detailDriverForm">
                <!-- ID tài xế - READ ONLY -->
                <div class="form-group">
                    <label class="form-label">ID tài xế:</label>
                    <input
                        type="text"
                        class="form-input readonly"
                        [(ngModel)]="currentDriver.driverID"
                        name="driverID"
                        readonly
                    />
                </div>
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập:</label>
                    <input
                        type="text"
                        class="form-input readonly"
                        [(ngModel)]="currentDriver.user.userName"
                        name="userName"
                        readonly
                    />
                </div>
                <!-- Username - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label">
                        Mật khẩu *( Ctrl + Z để hoàn lại mật khẩu ban đầu)<span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        class="form-input"
                        [(ngModel)]="currentDriver.user.password"
                        name="password"
                        required
                    />
                </div>

                <!-- Driver Name - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label"> Tên tài xế <span class="required">*</span> </label>
                    <input
                        type="text"
                        class="form-input"
                        [(ngModel)]="currentDriver.driverName"
                        name="driverName"
                        required
                    />
                </div>

                <!-- Address - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label"> Địa chỉ <span class="required">*</span> </label>
                    <textarea
                        class="form-input form-textarea"
                        [(ngModel)]="currentDriver.address"
                        name="address"
                        required
                    ></textarea>
                </div>

                <!-- Phone - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label"> Số điện thoại <span class="required">*</span> </label>
                    <input type="tel" class="form-input" [(ngModel)]="currentDriver.phone" name="phone" required />
                </div>

                <!-- License No - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label"> Số bằng lái <span class="required">*</span> </label>
                    <input
                        type="text"
                        class="form-input"
                        [(ngModel)]="currentDriver.licenseNo"
                        name="licenseNo"
                        required
                    />
                </div>

                <!-- Expire Date - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label"> Ngày hết hạn bằng lái <span class="required">*</span> </label>
                    <input
                        type="date"
                        class="form-input"
                        [(ngModel)]="currentDriver.expireDate"
                        name="expireDate"
                        required
                    />
                </div>

                <!-- Status - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label"> Trạng thái </label>
                    <select class="form-input" [(ngModel)]="currentDriver.status" name="status">
                        <!-- <option *ngIf="currentDriver.status == '0'" value="Available" disabled>🟢 Sẵn sàng nhận đơn</option>
            <option *ngIf="currentDriver.status == '1'" value="Busy" disabled>🔴 Đang bận giao hàng</option> -->
                        <option value="Available">🟢 Sẵn sàng nhận đơn</option>
                        <option value="Busy">🔴 Đang bận giao hàng</option>
                    </select>
                </div>

                <!--IsActive - CÓ THỂ EDIT -->
                <div class="form-group">
                    <label class="form-label"> Trạng thái hoạt động tại công ty </label>
                    <select class="form-input" [(ngModel)]="currentDriver.isActive" name="isActive">
                        <option value="true">✅ Đang làm việc</option>
                        <option value="false">❌ Đã nghỉ việc</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Loading template -->
        <ng-template #loadingTemplate>
            <div class="modal-body loading-container">
                <div class="loading"></div>
                <p>Đang tải thông tin...</p>
            </div>
        </ng-template>

        <div class="modal-footer" *ngIf="currentDriver">
            <button type="button" class="btn-secondary" (click)="closeDetailModal()">Đóng</button>
            <button type="button" class="btn-primary" (click)="updateDriverFromDetail(currentDriver.driverID)">
                Cập nhật
            </button>
        </div>
    </div>
</div>

<div class="pagination-container pagination-fade-in">
    <!-- Info Text -->
    <div class="pagination-info">Tổng <strong>1-10</strong> của <strong>156</strong> kết quả</div>

    <!-- Pagination Controls -->
    <div class="pagination-controls">
        <!-- Previous Button -->
        <button class="pagination-btn nav-btn prev" [disabled]="pageNumber === 1" (click)="changePage(pageNumber - 1)">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                <path
                    fill-rule="evenodd"
                    d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                    clip-rule="evenodd"
                />
            </svg>
            Trước
        </button>

        <!-- Page Numbers -->
        <button class="pagination-btn" [class.active]="pageNumber === 1" (click)="changePage(1)">1</button>
        <button class="pagination-btn" [class.active]="pageNumber === 2" (click)="changePage(2)">2</button>
        <button class="pagination-btn" [class.active]="pageNumber === 3" (click)="changePage(3)">3</button>
        <button class="pagination-btn mobile-hidden" [class.active]="pageNumber === 4" (click)="changePage(4)">
            4
        </button>
        <button class="pagination-btn mobile-hidden" [class.active]="pageNumber === 5" (click)="changePage(5)">
            5
        </button>

        <!-- Ellipsis -->
        <span class="pagination-ellipsis mobile-hidden">...</span>

        <!-- Last Page -->
        <button class="pagination-btn mobile-hidden" [class.active]="pageNumber === 16" (click)="changePage(16)">
            16
        </button>

        <!-- Next Button -->
        <button class="pagination-btn nav-btn next" [disabled]="pageNumber === 16" (click)="changePage(pageNumber + 1)">
            Sau
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                <path
                    fill-rule="evenodd"
                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                    clip-rule="evenodd"
                />
            </svg>
        </button>
    </div>
</div>
